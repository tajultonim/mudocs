<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to PNG in Browser</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { display: none; }
    img { border: 1px solid #ccc; max-width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Select a PDF to convert the first page to PNG</h2>
  <input type="file" id="pdfInput" accept="application/pdf" />
  <br />
  <img id="outputImage" alt="First Page as PNG" />
  <canvas id="pdfCanvas"></canvas>

  <!-- Load PDF.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
  <script>
    const input = document.getElementById('pdfInput');
    const img = document.getElementById('outputImage');
    const canvas = document.getElementById('pdfCanvas');
    const context = canvas.getContext('2d');

    input.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      const pdfData = new Uint8Array(arrayBuffer);

      const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
      const page = await pdf.getPage(1);

      const viewport = page.getViewport({ scale: 2.0 }); // Higher scale = higher resolution
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: context, viewport }).promise;

      // Convert to PNG Data URL and display
      const pngUrl = canvas.toDataURL('image/png');
      img.src = pngUrl;
    });
  </script>
</body>
</html>
